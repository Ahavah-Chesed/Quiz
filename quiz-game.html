      <div class="home-stats" aria-label="현재 퀴즈 구성"><div class="home-stat"><span class="home-stat-label">준비된 문제</span><strong>${fmt(qs.length)}<span class="muted" style="font-size:11px;font-weight:600"> 문제</span></strong></div><div class="stat-divider"></div><div class="home-stat"><span class="home-stat-label">내가 정한 난이도</span><strong>${range}</strong></div><div class="stat-divider"></div><div class="home-stat"><span class="home-stat-label">모두 맞히면</span><strong>${fmt(totalPoints(qs))}<span class="muted" style="font-size:11px;font-weight:600"> 점</span></strong></div></div>

tton></div>`;

    function chooseQuestion(id){if(!game.questions.some(q=>q.id===id)||game.results[id])return;game.currentId=id;game.phase='question';game.typed='';go('play');}

</div>`}`:`<form class="answer-form" id="answerForm" autocomplete="off"><label for="answerInput">내가 생각한 정답</label><div class="answer-row"><input class="field" id="answerInput" name="answer" placeholder="정답을 입력해 주세요" maxlength="3000" value="${esc(game.typed)}" aria-describedby="answerHelp" autocomplete="off"><button class="btn btn-primary" type="submit">제출하기 ${icon('arrow',16)}</button></div><p class="field-note" id="answerHelp">정답을 제출하면 자동으로 채점돼요. 띄어쓰기와 영문 대소문자는 구분하지 않아요.</p><p class="error-note" id="answerError" role="alert" hidden></p></form><div class="reveal-row"><small>함께 풀거나 진행자가 있는 퀴즈라면</small><button class="btn" data-action="reveal">${icon('eye',16)} 정답만 공개</button></div>`}</article><aside class="game-aside"><div class="score-panel"><div><div class="eyebrow">MY SCORE</div><div class="big-score">${fmt(score())}<small>점</small></div></div><div class="score-breakdown"><span>정답 <b>${correctCount()}</b></span><span>완료 <b>${done()} / ${game.questions.length}</b></span></div></div><div class="guide-panel"><h3>${icon('info',15)} 이렇게 즐겨요</h3><p>정답을 입력하면 자동 채점!<br>‘정답만 공개’를 누르면 정답을 보고 직접 정답·오답을 기록할 수 있어요.<br><br>주관식 답이 비슷하다면<br>공개 후 판정을 바꿀 수도 있어요.</p></div><button class="btn btn-quiet" data-action="finish">게임 마치기</button></aside></div><div class="progress-line" aria-label="진행률 ${done()} / ${game.questions.length}"><span style="width:${done()/game.questions.length*100}%"></span></div>`;
    }
    function submitAnswer(){
      const field=$('#answerInput'),text=field.value.trim();game.typed=text;
      if(!text){$('#answerError').textContent='답을 입력하거나 ‘정답만 공개’를 눌러 주세요.';$('#answerError').hidden=false;field.focus();return;}
      const isCorrect=answers(current()).some(a=>normalize(a)===normalize(text));

    function record(correct){const q=current();game.results[q.id]={correct,points:q.points,typed:game.typed};}

      if(!game.results[game.currentId]){toast('정답 또는 오답으로 점수를 먼저 기록해 주세요.');return;}

    }
    function renderSettings(){
      return `<div class="page-top"><div><button class="breadcrumb" data-action="home">${icon('back',14)} 처음 화면</button><h1>내 퀴즈를 만들어 볼까요?</h1><p>문제, 정답, 난이도, 배점까지 모두 직접 정해 보세요.</p></div></div><div class="settings-intro"><p><strong>여기서 만든 문제로 두 가지 방식을 모두 즐길 수 있어요.</strong><br>순서 진행은 아래 목록 순서대로 나와요. 화살표로 순서를 바꿔 주세요.</p><div class="settings-tools"><a class="btn" href="#" download="quiz-settings.json" data-action="export-json">${icon('download',14)} 설정 내보내기</a><button class="btn" data-action="import-json">${icon('upload',14)} 불러오기</button><a class="btn" href="#" download="quiz-game.html" data-action="download-html">${icon('download',14)} HTML 저장</a></div></div><div class="settings-basics"><div><label class="form-label" for="quizTitle">퀴즈 이름</label><input class="field" id="quizTitle" data-config-field="title" maxlength="40" value="${esc(draft.title)}" placeholder="우리만의 퀴즈 이름"></div><div><label class="form-label" for="defaultPoints">새 문제 기본 배점</label><input class="field" id="defaultPoints" data-config-field="defaultPoints" type="number" min="0" max="100000" step="1" value="${esc(draft.defaultPoints)}"><p class="field-note">새로 추가하는 문제에만 적용돼요.</p></div></div><div class="editor-heading"><h2>퀴즈 목록 <small id="editorCount">${draft.questions.length}개의 문제</small></h2><button class="btn btn-primary" data-action="add-question">${icon('plus',15)} 문제 추가</button></div><section class="editor-list" aria-label="퀴즈 편집 목록">${draft.questions.map((q,i)=>renderEditor(q,i)).join('')||`<div class="empty"><h2>첫 번째 문제를 만들어 보세요</h2><p>문제 추가를 누르고 문제와 정답을 적어 주세요.</p></div>`}</section><button class="add-large" data-action="add-question">${icon('plus',17)} 새 문제 추가하기</button><div class="settings-bottom"><p id="saveHint">${storageAvailable?'설정은 이 브라우저에 저장돼요.':'이 환경에서는 브라우저 저장이 제한돼요. HTML로 저장해 보관해 주세요.'}<br>HTML로 저장하면 만든 문제를 담은 파일을 받을 수 있어요.</p><div class="settings-save-actions"><button class="btn" data-action="cancel-settings">취소</button><button class="btn btn-primary" data-action="save-settings">${icon('check',16)} 저장하고 시작 화면으로</button></div></div>`;

    function validateDraft(){
      try{return validated(draft);}catch(e){
        toast(e.message);const m=e.message.match(/^(\d+)번/);
        if(m){const q=draft.questions[Number(m[1])-1],el=$$('.editor-card').find(x=>x.dataset.questionId===q?.id);if(el){el.classList.add('invalid');el.scrollIntoView({behavior:'smooth',block:'center'});const field=e.message.includes('정답')?'answer':e.message.includes('배점')?'points':'question';$(`[data-field="${field}"]`,el)?.focus({preventScroll:true});}}
        else if(e.message.includes('제목'))$('#quizTitle')?.focus();else if(e.message.includes('기본 배점'))$('#defaultPoints')?.focus();
        return null;

    function saveSettings(){
      const next=validateDraft();if(!next)return;
      config=next;let saved=true;
      try{localStorage.setItem(storageKey,JSON.stringify(config));storageAvailable=true;}catch(e){saved=false;storageAvailable=false;}
      dirty=false;draft=null;game=null;go('home');toast(saved?'설정을 저장했어요. 퀴즈 방식을 골라 주세요!':'설정을 적용했어요. 영구 보관하려면 HTML 저장을 눌러 주세요.');
    }
    function addQuestion(){
      if(draft.questions.length>=limits.questions){toast('문제는 최대 500개까지 등록할 수 있어요.');return;}

      const q={id:uid(),question:'',answer:'',stars:1,points};draft.questions.push(q);dirty=true;render();
      const el=$$('.editor-card').at(-1);el.scrollIntoView({behavior:'smooth',block:'center'});$('[data-field="question"]',el).focus({preventScroll:true});
    }
    function changeOrder(id,delta){const i=draft.questions.findIndex(q=>q.id===id),j=i+delta;if(i<0||j<0||j>=draft.questions.length)return;[draft.questions[i],draft.questions[j]]=[draft.questions[j],draft.questions[i]];dirty=true;const y=window.scrollY;render();window.scrollTo(0,y);}
    function download(name,data,type,link){
      const url=URL.createObjectURL(new Blob([data],{type}));
      if(link?.tagName==='A'){link.href=url;link.download=name;setTimeout(()=>{URL.revokeObjectURL(url);link.href='#';},60000);return;}
      const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
    }
    function exportJson(link){const data=view==='settings'?validateDraft():config;if(!data)return false;download('quiz-settings.json',JSON.stringify(data,null,2),'application/json;charset=utf-8',link);toast('설정 파일을 저장했어요. 불러오기로 다시 열 수 있어요.');return true;}
    function downloadHtml(link){
      const data=view==='settings'?validateDraft():config;if(!data)return false;
      const html=document.documentElement.cloneNode(true),payload={...clone(data),documentId:uid()};
      html.querySelector('#embedded-config').textContent=JSON.stringify(payload).replace(/</g,'\\u003c');
      html.querySelector('#screen').innerHTML='';html.querySelector('#toast').classList.remove('show');html.querySelector('#toast').textContent='';html.querySelector('#confirmDialog').removeAttribute('open');html.querySelector('#brandTitle').textContent=data.title;html.querySelector('title').textContent=data.title+' · 나만의 퀴즈 스튜디오';
      html.querySelectorAll('script').forEach(el=>{if(!['embedded-config','main-script'].includes(el.id))el.remove();});
      html.querySelectorAll('a[data-action="download-html"],a[data-action="export-json"]').forEach(el=>el.setAttribute('href','#'));
      download('quiz-game.html','<!doctype html>\n'+html.outerHTML,'text/html;charset=utf-8',link);toast('현재 설정을 담은 HTML 파일을 저장했어요.');return true;
    }
    async function importJson(file){
      if(!file)return;if(file.size>3*1024*1024){toast('3MB 이하의 설정 JSON 파일을 선택해 주세요.');return;}
      try{
        const data=validated(JSON.parse(await file.text()));
        confirmAction('이 설정을 불러올까요?',`${data.questions.length}개의 문제가 있는 ‘${data.title}’ 퀴즈예요.\n현재 편집 목록을 이 설정으로 바꿔요.`,'불러오기',()=>{draft=data;dirty=true;go('settings');toast('설정을 불러왔어요. 저장 버튼을 눌러 적용해 주세요.');});
      }catch(e){toast(e instanceof SyntaxError?'올바른 JSON 설정 파일을 선택해 주세요.':e.message);}
    }
    document.addEventListener('click',event=>{
      const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
      const action=button.dataset.action,id=button.dataset.id;
      switch(action){
        case'home':goHome();break;
        case'settings':openSettings();break;
        case'start-pick':start('pick');break;
        case'start-sequential':start('sequential');break;
        case'filter':filter=Number(button.dataset.level);render();break;
        case'choose-question':chooseQuestion(id);break;
        case'back-board':go('board');break;
        case'reveal':game.typed=$('#answerInput')?.value.trim()||'';game.phase='answer';render();break;
        case'judge-correct':record(true);render();break;
        case'judge-wrong':record(false);render();break;
        case'toggle-judgement':record(!game.results[game.currentId].correct);render();break;
        case'next':next();break;
        case'finish':finish();break;
        case'restart':start(game.mode);break;
        case'add-question':addQuestion();break;
        case'delete-question':{const i=draft.questions.findIndex(q=>q.id===id);if(i<0)return;confirmAction('이 문제를 삭제할까요?',`${i+1}번 문제를 편집 목록에서 삭제해요.\n설정을 취소하면 원래 목록으로 돌아갈 수 있어요.`,'삭제하기',()=>{draft.questions.splice(i,1);dirty=true;render();});break;}
        case'move-up':changeOrder(id,-1);break;
        case'move-down':changeOrder(id,1);break;
        case'set-stars':{const q=draft.questions.find(q=>q.id===id);q.stars=Number(button.dataset.level);dirty=true;const row=button.closest('.editor-options');$$('.star-button',row).forEach(el=>{el.classList.toggle('on',Number(el.dataset.level)<=q.stars);el.setAttribute('aria-pressed',String(Number(el.dataset.level)===q.stars));});$('.star-description',row).textContent=q.stars+' / 5';break;}
        case'save-settings':saveSettings();break;
        case'cancel-settings':goHome();break;
        case'export-json':if(!exportJson(button))event.preventDefault();break;
        case'import-json':$('#importFile').value='';$('#importFile').click();break;
        case'download-html':if(!downloadHtml(button))event.preventDefault();break;
        case'confirm-no':$('#confirmDialog').close();dialogCallback=null;break;
        case'confirm-yes':{const cb=dialogCallback;dialogCallback=null;$('#confirmDialog').close();cb?.();break;}
      }
    });
    document.addEventListener('submit',event=>{if(event.target.id==='answerForm'){event.preventDefault();submitAnswer();}});
    document.addEventListener('input',event=>{
      const el=event.target;if(view!=='settings')return;
      if(el.dataset.configField){draft[el.dataset.configField]=el.value;dirty=true;}
      if(el.dataset.field){const q=draft.questions.find(q=>q.id===el.dataset.id);if(q){q[el.dataset.field]=el.value;dirty=true;el.closest('.editor-card')?.classList.remove('invalid');}}
    });
    $('#importFile').addEventListener('change',event=>importJson(event.target.files[0]));
    $('#confirmDialog').addEventListener('cancel',()=>{dialogCallback=null;});
    window.addEventListener('beforeunload',event=>{if(view==='settings'&&dirty){event.preventDefault();event.returnValue='';}});
    render();
  })();
  </script>
</body>
</html>
